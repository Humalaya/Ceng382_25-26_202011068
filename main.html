<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gwynevere Art Gallery</title>
    <link rel="stylesheet" href="gözlemci.css">
    <link rel="stylesheet" href="tablo.css">
    <link rel="stylesheet" href="other.css"> 
</head>
<body>
    <div id="clock"></div>
    
    <h1 class="gallery-title">GWYNEVERE ART GALLERY</h1>
    
    <div class="gallery">
        <div class="painting">
            <div class="portrait">
                <div class="head">
                    <div class="eye left"></div>
                    <div class="eye right"></div>
                    <div class="top-hat"></div>
                    <div class="mustache"></div>
                </div>
                <div class="body"></div>
            </div>
        </div>
        <div class="viewer">
            <div class="viewer-head">
                <div class="viewer-eye"></div>
                <div class="viewer-mouth"></div>
                <div class="arm"></div>
                <div class="arm2"></div>
                <div class="hand"></div>
            </div>
            <div class="viewer-body"></div>
        </div>
    </div>
    
    <div class="login" id="loginForm">
        <h2>Login</h2>
        <input type="text" id="username" placeholder="Username" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit" id="loginButton">Login</button>
    </div>
    
    <script src="login.js"></script>
</body>
</html>
